let onlineUsers = [];

async function startPresence() {
  if (!current || current.isNew || !user) return;

  if (presenceChannel) {
    await db.removeChannel(presenceChannel);
    presenceChannel = null;
  }

  const channel = db.channel('note-presence-' + current.id);

  channel
    .on('presence', { event: 'sync' }, () => {
      const state = channel.presenceState();
      onlineUsers = Object.values(state).flat();

      const uniqueUsers = [
        ...new Map(
          onlineUsers.map(person => [person.user_id, person])
        ).values()
      ];

      $('onlineList').innerHTML = uniqueUsers.length
        ? uniqueUsers.map(person =>
            `<p>🟢 <b>${safe(person.nickname)}</b></p>`
          ).join('')
        : '현재 접속자가 없어.';
    })
    .on('broadcast', { event: 'y-update' }, ({ payload }) => {
      if (!ydoc || !payload?.update) return;

      Y.applyUpdate(
        ydoc,
        new Uint8Array(payload.update),
        'remote'
      );
    })
    .subscribe(async status => {
      if (status === 'SUBSCRIBED') {
        const { data } = await db
          .from('profiles')
          .select('nickname')
          .eq('id', user.id)
          .maybeSingle();

        await channel.track({
          user_id: user.id,
          nickname: data?.nickname || '익명',
          online_at: new Date().toISOString()
        });
      }
    });

  presenceChannel = channel;
}

async function stopPresence() {
  if (presenceChannel) {
    await db.removeChannel(presenceChannel);
    presenceChannel = null;
  }

  onlineUsers = [];

  $('onlineList').textContent = '노트를 열면 접속자가 표시돼.';
}

let folders = [];
let activeFolder = null;

async function loadFolders() {
  const { data, error } = await db
    .from('folders')
    .select('*')
    .order('created_at');

  if (error) {
    alert('폴더 불러오기 실패: ' + error.message);
    return;
  }

  folders = data || [];
  renderFolders();
}

function renderFolders() {
  $('folderList').innerHTML =
    '<button class="alt" id="allFolders">전체 노트</button>' +
    folders.map(f =>
      `<span>
        <button class="alt" data-folder="${f.id}">${safe(f.name)}</button>
        <button class="alt" data-rename-folder="${f.id}">✎</button>
        <button class="alt" data-delete-folder="${f.id}">×</button>
      </span>`
    ).join('');

  $('allFolders').onclick = () => {
    activeFolder = null;
    render();
  };

  document.querySelectorAll('[data-folder]').forEach(b => {
    b.onclick = () => {
      activeFolder = b.dataset.folder;
      render();
    };
  });

  document.querySelectorAll('[data-rename-folder]').forEach(b => {
    b.onclick = async () => {
      const id = b.dataset.renameFolder;
      const folder = folders.find(f => f.id === id);
      const name = prompt('새 폴더 이름을 입력해 줘.', folder.name);

      if (name === null) return;
      if (!name.trim()) return alert('폴더 이름을 입력해 줘.');

      const { error } = await db
        .from('folders')
        .update({ name: name.trim() })
        .eq('id', id);

      if (error) return alert(error.message);

      await loadFolders();
    };
  });

  document.querySelectorAll('[data-delete-folder]').forEach(b => {
    b.onclick = async () => {
      const id = b.dataset.deleteFolder;
      const folder = folders.find(f => f.id === id);

      if (!confirm(`'${folder.name}' 폴더를 삭제할까?`)) return;

      const { error } = await db
        .from('folders')
        .delete()
        .eq('id', id);

      if (error) return alert(error.message);

      if (activeFolder === id) activeFolder = null;

      await loadFolders();
      render();
    };
  });
}
$('addFolder').onclick = async () => {
  const name = $('folderName').value.trim();
  if (!name) return alert('폴더 이름을 입력해 줘.');

  const { error } = await db.from('folders').insert({
    name,
    owner_id: user.id
  });

  if (error) return alert(error.message);

  $('folderName').value = '';
  await loadFolders();
};

$('share').onclick = async () => {
  if (!current || current.isNew) {
    alert('먼저 노트를 저장해 줘.');
    return;
  }

  const token = crypto.randomUUID();

  const { error } = await db
    .from('note_share_invites')
    .insert({
      note_id: current.id,
      token,
      created_by: user.id,
      expires_at: new Date(
        Date.now() + 7 * 24 * 60 * 60 * 1000
      ).toISOString()
    });

  if (error) {
    alert('공유 링크 생성 실패: ' + error.message);
    return;
  }

  const link =
    location.origin +
    location.pathname +
    '?invite=' +
    encodeURIComponent(token);

  try {
    await navigator.clipboard.writeText(link);
    alert('공유 링크가 복사됐어! 7일 동안 유효해.');
  } catch (e) {
    prompt('아래 링크를 복사해 줘.', link);
  }
};

async function acceptInviteFromUrl() {
  const url = new URL(location.href);
  const token = url.searchParams.get('invite');

  if (!token) return;

  url.searchParams.delete('invite');
  history.replaceState({}, '', url.toString());

  const { data, error } = await db.rpc(
    'accept_note_share_invite',
    { p_token: token }
  );

  if (error) {
    alert('초대 수락 실패: ' + error.message);
    return;
  }

  activeFolder = null;
  alert('공동 편집자로 참여했어!');
}

  const isOwner = isSaved && current.owner_id === user.id;

  $('share').classList.toggle('hidden', !isOwner);
  $('delete').classList.toggle('hidden', isSaved && !isOwner);

 async function loadParticipants() {
  const list = $('participantList');

  if (!current || current.isNew) {
    list.textContent = '노트를 먼저 저장해 줘.';
    return;
  }

  list.textContent = '참여자 불러오는 중...';

  const { data, error } = await db
    .from('note_collaborators')
    .select('user_id')
    .eq('note_id', current.id);

  if (error) {
    list.textContent = '참여자 불러오기 실패: ' + error.message;
    return;
  }

  const ids = [
    ...new Set([
      current.owner_id,
      ...(data || []).map(person => person.user_id)
    ])
  ];

  const { data: profiles, error: profileError } = await db
    .from('profiles')
    .select('id, nickname')
    .in('id', ids);

  if (profileError) {
    list.textContent = '닉네임 불러오기 실패: ' + profileError.message;
    return;
  }

  list.innerHTML = ids.map(id => {
    const person = profiles?.find(p => p.id === id);
    const isOwner = id === current.owner_id;
    const nickname = person?.nickname || '닉네임 미설정';

    return `<p>
      ${isOwner ? '👑' : '👤'}
      <b>${safe(nickname)}</b>
      <span class="muted">${isOwner ? '소유자' : '공동 편집자'}</span>

  }).join('');

async function loadAttachments() {
  const list = $('attachmentList');

  if (!current || current.isNew) {
    list.textContent = '노트를 먼저 저장해 줘.';
    return;
  }

  list.textContent = '첨부 파일 불러오는 중...';

  const { data, error } = await db.storage
    .from('note-files')
    .list(current.id);

  if (error) {
    list.textContent = '파일 불러오기 실패: ' + error.message;
    return;
  }

  if (!data || data.length === 0) {
    list.textContent = '아직 첨부 파일이 없어.';
    return;
  }

  const files = await Promise.all(
    data.map(async file => {
      const path = current.id + '/' + file.name;

      const { data: signed, error } = await db.storage
        .from('note-files')
        .createSignedUrl(path, 3600);

      return {
        name: file.name,
        url: error ? null : signed.signedUrl
      };
    })
  );

  list.innerHTML = files.map(file =>
    file.url
      ? `<p>📎 <a href="${safe(file.url)}" target="_blank" rel="noopener noreferrer">${safe(file.name)}</a></p>`
      : `<p>📎 ${safe(file.name)} (열기 실패)</p>`
  ).join('');
}
    async function open(id) {
    current = notes.find(n => n.id === id);

    startPresence();
    updateEditorPermissions();
    loadAttachments();
    loadParticipants();

    $('title').value = current.title;

    ydoc = new Y.Doc();
    ytext = ydoc.getText('content');

    if (current.yjs_state) {
      const binary = Uint8Array.from(
        atob(current.yjs_state),
        c => c.charCodeAt(0)
      );
      Y.applyUpdate(ydoc, binary);
    } else if (current.content) {
      ytext.insert(0, current.content);
    }

    $('content').value = ytext.toString();
      ydoc.on('update', (update, origin) => {
  if (origin === 'remote') {
    $('content').value = ytext.toString();
    return;
  }

  if (presenceChannel) {
    presenceChannel.send({
      type: 'broadcast',
      event: 'y-update',
      payload: {
        update: Array.from(update)
      }
    });
  }
});

$('content').oninput = () => {
  const oldText = ytext.toString();
  const newText = $('content').value;

  let start = 0;

  while (
    start < oldText.length &&
    start < newText.length &&
    oldText[start] === newText[start]
  ) {
    start++;
  }

  let oldEnd = oldText.length;
  let newEnd = newText.length;

  while (
    oldEnd > start &&
    newEnd > start &&
    oldText[oldEnd - 1] === newText[newEnd - 1]
  ) {
    oldEnd--;
    newEnd--;
  }

  ydoc.transact(() => {
    if (oldEnd > start) {
      ytext.delete(start, oldEnd - start);
    }

    if (newEnd > start) {
      ytext.insert(start, newText.slice(start, newEnd));
    }
  });
};

async function save(){if(!current)return false;let payload={title:$('title').value.trim(),content:$('content').value,updated_at:new Date().toISOString()},res;if(current.isNew)res=await db.from('notes').insert({
  ...payload,
  owner_id:user.id,
  folder_id:activeFolder
}).select().single();else res=await db.from('notes').update(payload).eq('id',current.id).select().single();if(res.error){alert('저장 실패: '+res.error.message);return false}current=res.data;current.isNew=false;updateEditorPermissions();loadAttachments();notes=notes.filter(n=>n.id!==current.id);notes.unshift(current);say('저장됨');return true}
$('fileInput').onchange = async () => {
  if (!current || current.isNew) {
    alert('먼저 노트를 저장해 줘!');
    $('fileInput').value = '';
    return;
  }

  const files = Array.from($('fileInput').files || []);

  for (const file of files) {
    if (file.size > 20 * 1024 * 1024) {
      alert(file.name + '은 20MB를 초과해서 업로드할 수 없어.');
      continue;
    }

    const fileName = file.name.replace(/[\/\\]/g, '_');
    const path = current.id + '/' + crypto.randomUUID() + '-' + fileName;

    const { error } = await db.storage
      .from('note-files')
      .upload(path, file, { upsert: false });

    if (error) {
      alert(file.name + ' 업로드 실패: ' + error.message);
    }
  }

  $('fileInput').value = '';
  await loadAttachments();
};

};

$('delete').onclick=async()=>{if(!current)return;if(current.isNew){close();return}if(!confirm('이 노트를 삭제할까?'))return;let {error}=await db.from('notes').delete().eq('id',current.id);if(error){alert(error.message);return}notes=notes.filter(n=>n.id!==current.id);current=null;close()};
$('search').oninput=render;$('logout').onclick=async()=>{await db.auth.signOut();user=null;notes=[];authView('로그아웃했어.')};
